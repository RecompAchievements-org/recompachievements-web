name: Backend

on:
  pull_request:
    branches: [develop, main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [develop, main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore && dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      # Integration tests start a PostgreSQL container with Testcontainers (Docker is on the runner).
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Check for model changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/RecompAchievements.Api --no-build --configuration Release
        env:
          ConnectionStrings__Database: "Host=localhost;Database=unused;Username=unused;Password=unused"

      - name: Build container image
        run: docker build -t recompachievements-api .
