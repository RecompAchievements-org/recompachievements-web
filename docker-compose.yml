# Local development services. Credentials are for local use only and match
# backend/src/RecompAchievements.Api/appsettings.Development.json.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recompachievements
      POSTGRES_USER: recomp
      POSTGRES_PASSWORD: recomp_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recomp -d recompachievements"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
